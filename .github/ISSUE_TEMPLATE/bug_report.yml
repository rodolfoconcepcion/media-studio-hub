name: 🐛 Bug Report
description: Report a reproducible problem or error in Media Studio Hub.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the issue.
      placeholder: |
        1. Submit URL '...'
        2. Click 'Download'
        3. See error in logs...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Deployment Environment
      options:
        - "Standalone Python (Linux / macOS)"
        - "Home Assistant Add-on"
        - "CasaOS / Docker Compose"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Paste any server terminal logs or browser console messages.
      render: shell
