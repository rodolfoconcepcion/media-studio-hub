name: CI / Automated Tests & Build

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install System Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutagen yt-dlp spotdl

      - name: Run Test Suite
        run: |
          python tests/test_media_server.py

  validate-manifests:
    name: Validate Add-on & Compose Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Home Assistant Add-on Manifest
        run: |
          python -c "
          import yaml
          with open('ha-addon/config.yaml') as f:
              data = yaml.safe_load(f)
          assert data['name'] == 'Media Studio'
          assert data['slug'] == 'media_studio'
          assert data['ingress'] is True
          print('✅ ha-addon/config.yaml is valid!')

          with open('repository.yaml') as f:
              repo_data = yaml.safe_load(f)
          assert 'name' in repo_data
          print('✅ repository.yaml is valid!')
          "

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
          echo "✅ docker-compose.yml is valid!"

  docker-build:
    name: Build Multi-Platform Docker Image
    runs-on: ubuntu-latest
    needs: [test, validate-manifests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: media-studio:ci-test
