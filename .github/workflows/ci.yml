name: CI / Automated Tests & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutagen yt-dlp spotdl

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  validate-manifests:
    name: Validate Add-on & Compose Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Home Assistant Add-on Manifest
        run: |
          python -c "
          import yaml
          with open('ha-addon/config.yaml') as f:
              data = yaml.safe_load(f)
          assert data['name'] == 'Media Studio'
          assert data['slug'] == 'media_studio'
          assert data['ingress'] is True
          print('✅ ha-addon/config.yaml is valid!')

          with open('repository.yaml') as f:
              repo_data = yaml.safe_load(f)
          assert 'name' in repo_data
          print('✅ repository.yaml is valid!')
          "

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
          echo "✅ docker-compose.yml is valid!"

  docker-build:
    name: Build Multi-Platform Docker Image
    runs-on: ubuntu-latest
    needs: [test, validate-manifests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: media-studio:ci-test
